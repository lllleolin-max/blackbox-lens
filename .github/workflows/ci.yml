name: installed-wheel-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools build
      - run: python -m build
      - run: python -m pip install --no-deps --no-index --find-links dist blackbox-lens
      - run: python -m unittest discover -s tests -v
      - run: blackbox-lens demo --out demo-run
      - run: blackbox-lens analyze demo-run --out run-recomputed
      - run: python -m pip check
